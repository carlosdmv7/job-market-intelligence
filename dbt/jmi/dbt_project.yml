name: jmi
version: 0.1.0
config-version: 2
profile: jmi
require-dbt-version: ">=1.8.0"

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  jmi:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: table
      +schema: staging
    marts:
      +materialized: table
      +schema: marts

seeds:
  jmi:
    +schema: staging
    recognised_sponsors:
      +column_types:
        organisation: varchar
        kvk_number: varchar  # keep leading zeros; KvK is an identifier, not a number

vars:
  # A posting counts as active if we still saw it within this many days of the
  # corpus's newest observation. The pipeline sweeps daily, so a live posting is
  # normally re-seen every run; 7 days absorbs a flaky scrape without letting a
  # filled role linger as if it were open.
  active_window_days: 7

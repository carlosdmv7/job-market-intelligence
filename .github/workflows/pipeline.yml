name: Pipeline

# Prefect Cloud holds the `jmi-daily/daily` deployment: its schedule (05:15
# UTC daily), its parameters and its run history. This workflow lends it a
# machine. Every hour it registers the deployment from the code on main, asks
# Cloud whether a run is due — the scheduled one, or one started by hand from
# the Prefect UI — and if so runs it (orchestration/jmi_flows/gha_runner.py).
# An idle hour exits in about a minute.
#
# Why this and not a Prefect work pool: the free tier has no hybrid pools, and
# its serverless compute is 500 minutes a month against ~300 for this pipeline
# alone. Actions minutes on a public repo are free.
#
# The run summary goes to the warehouse (meta.pipeline_run) from inside the
# flow, so nothing is written back to the repo.

on:
  schedule:
    - cron: "7 * * * *" # hourly, off the hour: shared cron slots are congested
  workflow_dispatch: # run whatever is due now, e.g. right after a UI "Run"

concurrency:
  group: pipeline
  cancel-in-progress: false # never kill a half-finished warehouse write

permissions:
  contents: read

jobs:
  worker:
    name: Prefect worker (one pass)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PREFECT_API_URL: ${{ secrets.PREFECT_API_URL }}
      PREFECT_API_KEY: ${{ secrets.PREFECT_API_KEY }}
      motherduck_token: ${{ secrets.MOTHERDUCK_TOKEN }}
      JMI_DUCKDB_DATABASE: md:job-market-intelligence
      ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      JMI_LLM_PROVIDER: gemini
      JMI_LLM_MODEL: gemini-2.5-flash-lite
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install workspace
        run: uv sync --all-packages

      - name: Run what Prefect has due
        run: uv run python -m jmi_flows.gha_runner

name: Daily pipeline

# The 0-cost scheduler: GitHub Actions runs the same Make-driven pipeline a
# Prefect worker would. The flows carry @flow decorators and WILL report to
# Prefect Cloud if PREFECT_API_URL/KEY are set as repo secrets — they are
# not, so today nothing is tracked there and this workflow's own run log is
# the record.
#
# Daily cadence is what feeds marts.FT_JOB_SNAPSHOT_DAILY — the Market Trends
# "over time" charts only accumulate history if this actually runs every day.

on:
  schedule:
    - cron: "15 5 * * *" # 07:15 Europe/Amsterdam (CEST) — before the workday
  workflow_dispatch: # manual runs for testing / catch-up

concurrency:
  group: daily-pipeline
  cancel-in-progress: false # never kill a half-finished warehouse write

# Nothing is written back to the repo: the run summary goes to the
# warehouse (meta.pipeline_run), not to a committed file.
permissions:
  contents: read

jobs:
  pipeline:
    name: ingest -> enrich -> dbt build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      motherduck_token: ${{ secrets.MOTHERDUCK_TOKEN }}
      JMI_DUCKDB_DATABASE: md:job-market-intelligence
      ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      JMI_LLM_PROVIDER: gemini
      JMI_LLM_MODEL: gemini-2.5-flash-lite
      # Optional: report flow runs to Prefect Cloud when both are set.
      PREFECT_API_URL: ${{ secrets.PREFECT_API_URL }}
      PREFECT_API_KEY: ${{ secrets.PREFECT_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install workspace
        run: uv sync --all-packages

      # One flaky job board must not cost the day's snapshot, so each source
      # ingests independently; a failure stays visible as a red step.
      - name: Ingest — Adzuna NL/DE/ES (local per-country corpora)
        continue-on-error: true
        run: |
          for c in nl de es; do
            uv run python -m jmi_flows.ingest --source adzuna --country "$c" || true
          done

      - name: Ingest — JobTech SE (Platsbanken, keyless)
        continue-on-error: true
        run: uv run python -m jmi_flows.ingest --source jobtech

      - name: Ingest — free remote boards
        continue-on-error: true
        run: |
          for s in remotive arbeitnow remoteok; do
            uv run python -m jmi_flows.ingest --source "$s" || true
          done

      # 200 postings = the measured quota ceiling (20 requests/day/model, per the
      # 429 body's GenerateRequestsPerDayPerProjectPerModel-FreeTier) times the
      # 10 postings that now ride in each request. The quota is counted in
      # requests, not tokens, so batching is the whole multiplier.
      #
      # Data roles only, freshest first (see fetch_postings_needing_enrichment).
      # Best-effort: it must never eat the job's time budget and starve dbt
      # build (the classifier also opens a circuit breaker after 5 consecutive
      # provider failures, e.g. an exhausted daily quota).
      - name: Enrich pending postings (LLM)
        continue-on-error: true
        timeout-minutes: 20
        run: uv run python -m jmi_flows.enrich --limit 200

      - name: dbt build (staging -> marts)
        working-directory: dbt/jmi
        run: |
          uv run dbt deps
          uv run dbt build

      # The run summary goes to meta.pipeline_run in the warehouse, next to
      # every other number the app shows. It used to be distilled into a
      # committed JSON file, which meant pushing two commits to main every
      # single day — 58 of them in the first month, burying the human history.
      # if: always() so a run that died mid-ingest is recorded as having died.
      - name: Record the run in the warehouse
        if: always()
        env:
          JMI_RUN_CONCLUSION: ${{ job.status }}
        run: uv run python -m jmi_flows.dbt_status
